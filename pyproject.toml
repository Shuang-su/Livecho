[project]
name = "livecho-dev"
version = "0.0.0"
description = "Development tooling for the Livecho monorepo"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.2",
  "ruff==0.12.11",
]

[tool.uv]
package = false
required-version = "==0.12.1"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib"
pythonpath = ["."]
testpaths = ["tests", "apps", "packages", "services", "workers", "tools"]
norecursedirs = [
  ".*",
  "*.egg",
  "*.egg-info",
  "CVS",
  "__pycache__",
  "_darcs",
  "{arch}",
  "build",
  "coverage",
  "dist",
  "node_modules",
  "playwright-report",
  "test-results",
  "venv",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs/changes/_template"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["."]
exclude_gitignore = true

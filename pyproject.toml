[project]
name = "livecho-dev"
version = "0.0.0"
description = "Development tooling for the Livecho monorepo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography==50.0.2",
    "fastapi==0.163.0",
    "mlx==0.31.1 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy==2.4.4 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pydantic==2.13.5",
    "rfc8785==0.1.4",
    "safetensors==0.7.0 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "tokenizers==0.22.2 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "uvicorn==0.54.0",
    "websockets==17.4",
]

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.2",
  "ruff==0.12.11",
]

[tool.uv]
package = false
required-version = "==0.12.1"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib"
markers = [
  "stress: long real-time saturation runs excluded from `make verify`",
]
pythonpath = [".", "packages/protocol/python", "services/backend/src", "workers/mlx/src"]
testpaths = ["tests", "apps", "packages", "services", "workers", "tools"]
norecursedirs = [
  ".*",
  "*.egg",
  "*.egg-info",
  "CVS",
  "__pycache__",
  "_darcs",
  "{arch}",
  "build",
  "coverage",
  "dist",
  "node_modules",
  "playwright-report",
  "test-results",
  "venv",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs/changes/_template"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["."]
exclude_gitignore = true
mypy_path = "packages/protocol/python, services/backend/src, workers/mlx/src"

[[tool.mypy.overrides]]
module = ["mlx", "mlx.*", "numpy", "numpy.*", "safetensors", "safetensors.*", "tokenizers", "tokenizers.*"]
ignore_missing_imports = true

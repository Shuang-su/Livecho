name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: "11.21.0"
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22.22.1"
          cache: pnpm

      - name: Bootstrap
        run: make bootstrap

      - name: Verify
        env:
          LIVECHO_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LIVECHO_HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: make verify

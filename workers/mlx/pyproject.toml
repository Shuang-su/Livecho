[project]
name = "livecho-mlx-worker"
version = "0.1.0"
description = "Livecho local MLX worker CLI (fixture/contract path; real MLX gated)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic==2.13.5",
]

[project.scripts]
livecho-mlx-worker = "livecho_mlx_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/livecho_mlx_worker"]

[tool.hatch.build.targets.wheel.sources]
"src/livecho_mlx_worker" = "livecho_mlx_worker"
